name: template-build
on:
  push:
    paths:
      - 'docker/template/**'
    tags:
      - 'template-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (GITHUB_TOKEN — kein PAT noetig)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: docker/template
          push: true
          tags: |
            ghcr.io/martinschweikardt-lang/eduadapt-pod:latest
            ghcr.io/martinschweikardt-lang/eduadapt-pod:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
